# OpenAI provider profile, adapted from OpenShell's providers/openai.yaml.
# The only change: `binaries` names the program in OUR image that calls the
# API (the Python agent), instead of curl.
id: openai-triage
display_name: OpenAI (triage agent)
description: OpenAI inference API for the triage agent
category: inference
inference_capable: true
credentials:
  - name: api_key
    description: OpenAI API key
    env_vars: [OPENAI_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [api_key]
endpoints:
  - host: api.openai.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
binaries: [/usr/bin/python3.12]
